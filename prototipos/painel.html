<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bella Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shrikhand&family=Nunito:wght@500;700;800;900&display=swap">
<style>
:root{--bg:#fbf3e4;--card:#fffaf0;--soft:#f1e5cf;--fg:#233b2b;--ink:#233b2b;--on-ink:#fbf3e4;--shadow:#233b2b;--accent:#d8432f;--on-accent:#fff;--mustard:#f2c14e;--muted:rgba(35,59,43,.62);--line:rgba(35,59,43,.14);--ok:#2f7d4f;--map-bg:#f4ead6;--map-st:#fffaf0;--map-av:#ffffff;--map-park:#d3e3c2;--map-water:#b3d5e4;--map-lbl:rgba(35,59,43,.42);color-scheme:light}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--fg);font-family:"Nunito",system-ui,sans-serif;font-size:14px;min-height:100dvh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.band{height:12px;background:repeating-conic-gradient(var(--accent) 0 25%,var(--bg) 0 50%) 0 0/12px 12px}
.top{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:2px solid var(--ink);background:var(--card);position:sticky;top:0;z-index:30;flex-wrap:wrap}
.logo{font-family:"Shrikhand";font-size:24px;color:var(--accent);transform:rotate(-3deg);line-height:1}
.logo small{font-family:"Nunito";font-weight:900;font-size:11px;color:var(--fg);letter-spacing:.12em;text-transform:uppercase;margin-left:6px;vertical-align:middle}
.sp{flex:1}
.seg{display:inline-flex;border:2px solid var(--ink);border-radius:99px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;padding:7px 14px;font-weight:900;font-size:13px}
.seg button.on{background:var(--ink);color:var(--on-ink)}
.pill{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--ink);border-radius:99px;padding:5px 12px;font-weight:900;font-size:12.5px;background:var(--card)}
.pill i{width:8px;height:8px;border-radius:9px;background:var(--ok)}
.pill.off i{background:var(--accent)}
.wrap{display:grid;grid-template-columns:200px minmax(0,1fr);min-height:calc(100dvh - 70px)}
nav{border-right:2px solid var(--ink);padding:16px 10px;display:grid;align-content:start;gap:6px;background:var(--card)}
nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;font-weight:900;font-size:14px}
nav button:hover{background:var(--soft)}
nav button.on{background:var(--ink);color:var(--on-ink)}
nav button:focus-visible{outline:2px solid var(--accent)}
nav b{margin-left:auto;background:var(--accent);color:#fff;border-radius:99px;font-size:11px;padding:2px 7px}
nav .foot{margin-top:18px;font-size:12px;color:var(--muted);padding:0 6px;line-height:1.45}
main{padding:20px;min-width:0}
h1.t{font-family:"Shrikhand";font-weight:400;font-size:30px;color:var(--accent);line-height:1.05}
.sub{color:var(--muted);margin-top:4px;max-width:70ch;line-height:1.45}
.hd{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.btn{border:2px solid var(--ink);border-radius:14px;padding:9px 14px;font-weight:900;font-size:13.5px;background:var(--card);box-shadow:3px 3px 0 var(--shadow);transition:transform .1s,box-shadow .1s;display:inline-flex;align-items:center;gap:6px;justify-content:center;text-decoration:none;color:inherit}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}
.btn.red{background:var(--accent);color:#fff}
.btn.dark{background:var(--ink);color:var(--on-ink)}
.btn.ghost{box-shadow:none;border-color:var(--line)}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:11px;box-shadow:2px 2px 0 var(--shadow)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.card{background:var(--card);border:2px solid var(--ink);border-radius:20px;padding:14px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--card);border:2px solid var(--ink);border-radius:18px;padding:12px 14px}
.stat small{display:block;font-weight:800;color:var(--muted);font-size:12px}
.stat b{font-size:22px;font-weight:900;font-variant-numeric:tabular-nums}
/* kanban */
.kb{display:grid;grid-template-columns:repeat(5,minmax(205px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px;align-items:start}
.col{background:var(--soft);border-radius:20px;padding:10px;min-height:200px}
.col h3{font-weight:900;font-size:14px;display:flex;justify-content:space-between;padding:4px 6px 10px}
.col h3 span{background:var(--card);border:2px solid var(--ink);border-radius:99px;padding:0 8px;font-size:12px}
.oc{background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:12px;margin-bottom:10px;box-shadow:3px 3px 0 var(--shadow);animation:pop .25s}
.oc.new{box-shadow:3px 3px 0 var(--accent);border-color:var(--accent)}
@keyframes pop{from{transform:scale(.96);opacity:0}}
.oc .r1{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.oc .num{font-weight:900;font-size:16px}
.chip{font-size:11px;font-weight:900;border-radius:8px;padding:2px 7px;background:var(--soft)}
.chip.site{background:var(--mustard);color:#233b2b}
.chip.warn{background:var(--accent);color:#fff}
.tm{margin-left:auto;font-size:12px;font-weight:900;font-variant-numeric:tabular-nums}
.tm.late{color:var(--accent)}
.oc .who{font-weight:800;margin-top:6px}
.oc .addr{font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.35}
.oc ul{list-style:none;padding:8px 0;margin:8px 0;border-block:1px dashed var(--line);display:grid;gap:3px;font-size:13px}
.oc ul small{color:var(--muted)}
.oc .tot{display:flex;justify-content:space-between;font-weight:900}
.oc .acts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.oc .acts .btn{flex:1;white-space:nowrap}.oc .acts .btn[style*="flex:none"]{padding:6px 8px}
/* pdv */
.pdv{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;align-items:start}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.pc{border:2px solid var(--ink);border-radius:18px;background:var(--card);padding:8px;text-align:left;box-shadow:3px 3px 0 var(--shadow);position:relative}
.pc:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}
.pc img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;display:block}
.pc b{display:block;font-weight:900;font-size:13.5px;line-height:1.2;margin-top:7px}
.pc .pr{position:absolute;top:2px;right:2px;background:var(--mustard);color:#233b2b;border:2px solid #233b2b;border-radius:9px;font-weight:900;font-size:12px;padding:2px 7px;transform:rotate(5deg)}
.pc em{position:absolute;top:8px;left:8px;background:var(--accent);color:#fff;font-style:normal;font-weight:900;font-size:12px;border-radius:99px;min-width:24px;height:24px;display:grid;place-items:center;border:2px solid #fff}
.tk{position:sticky;top:84px}
.tk h3{font-family:"Shrikhand";font-weight:400;font-size:22px;color:var(--accent)}
.lbl{display:block;font-size:12px;font-weight:900;color:var(--muted);margin:12px 0 5px}
.in{width:100%;border:2px solid var(--ink);border-radius:12px;padding:9px 11px;background:var(--bg);outline:0;font-weight:700}
.in:focus{border-color:var(--accent)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.segs{display:flex;flex-wrap:wrap;gap:6px}
.segs button{border:2px solid var(--ink);border-radius:99px;padding:6px 12px;font-weight:900;font-size:12.5px;background:var(--card)}
.segs button.on{background:var(--ink);color:var(--on-ink)}
.tl{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line)}
.tl span{flex:1;font-weight:800;font-size:13.5px}
.q{display:inline-flex;align-items:center;border:2px solid var(--ink);border-radius:99px;height:28px}
.q button{border:0;background:none;width:26px;font-weight:900}
.q b{min-width:14px;text-align:center;font-size:12.5px}
.sum{display:grid;gap:4px;margin-top:10px;font-size:13.5px}
.sum div{display:flex;justify-content:space-between}
.sum .big{font-size:20px;font-weight:900;margin-top:4px}
.zbox{margin-top:8px;border-radius:12px;padding:10px 12px;font-weight:800;font-size:13px;line-height:1.35}
.zbox.ok{background:color-mix(in srgb,var(--ok) 16%,transparent)}
.zbox.no{background:color-mix(in srgb,var(--accent) 16%,transparent)}
.pc.out{opacity:.55;cursor:not-allowed}.pc.out .pr{background:var(--accent);color:#fff}
.catb{background:var(--soft);border-radius:20px;padding:10px;margin-bottom:12px}
.cath{display:flex;align-items:center;gap:10px;padding:2px 2px 10px}.cath .cn{max-width:260px;font-weight:900;font-size:15px;background:var(--card)}.cath small{color:var(--muted);font-weight:800;flex:1}
.prow{display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:8px 10px;margin-bottom:8px;flex-wrap:wrap}
.prow.sel{border-color:var(--accent);box-shadow:3px 3px 0 var(--shadow)}.prow.hid{opacity:.55}
.prow img{width:56px;height:56px;border-radius:12px;object-fit:cover;flex:none}
.prow .t{flex:1;min-width:140px}.prow b{font-weight:900}.prow small{display:block;color:var(--muted);font-size:12.5px;font-weight:700}
.tg{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:900;cursor:pointer}.tg input{width:17px;height:17px;accent-color:var(--accent)}
.photo{display:grid;place-items:center;aspect-ratio:4/3;border:2px dashed var(--ink);border-radius:16px;margin-top:10px;cursor:pointer;overflow:hidden;position:relative;background:var(--soft);text-align:center;font-size:13px;line-height:1.5}
.photo span{font-size:13px}.photo span:first-line{font-size:30px}.photo img{width:100%;height:100%;object-fit:cover}
.photo em{position:absolute;bottom:8px;right:8px;font-style:normal;background:var(--ink);color:var(--on-ink);font-weight:900;font-size:12px;border-radius:99px;padding:5px 10px}
.photo:focus-within{outline:2px solid var(--accent)}
.adr{display:flex;gap:6px;margin-bottom:6px}.adr .in{padding:7px 9px}
textarea.in{resize:vertical;font-weight:600}
.pe{max-height:calc(100dvh - 100px);overflow-y:auto}
.me{display:flex;align-items:center;gap:8px}.me .av{width:32px;height:32px;font-size:13px}.me b{display:block;font-weight:900;font-size:13px;line-height:1.1}.me small{color:var(--muted);font-size:11.5px;font-weight:800}
.login{max-width:720px;margin:0 auto;padding:40px 16px;text-align:center}
.users{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.ut{border:2px solid var(--ink);border-radius:18px;background:var(--card);padding:14px 8px;display:grid;justify-items:center;gap:4px;box-shadow:3px 3px 0 var(--shadow)}
.ut.on{border-color:var(--accent);box-shadow:3px 3px 0 var(--accent)}.ut .av{width:46px;height:46px;font-size:18px}.ut b{font-weight:900}.ut small{color:var(--muted);font-weight:800;font-size:12px}
.pinbox{margin:22px auto 0;max-width:260px}.pinbox p{font-weight:800}
.dots{display:flex;justify-content:center;gap:12px;margin:12px 0}.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink)}.dots i.on{background:var(--ink)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.pad button{height:56px;border:2px solid var(--ink);border-radius:16px;background:var(--card);font-weight:900;font-size:20px;box-shadow:2px 2px 0 var(--shadow)}
.pad button:active{transform:translate(2px,2px);box-shadow:none}
.wamsg{margin-top:6px;font-size:12px;font-weight:800;color:var(--ok)}
.kds{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;align-items:start}
.kc{background:var(--card);border:2px solid var(--ink);border-radius:20px;padding:14px;box-shadow:4px 4px 0 var(--shadow)}
.kc.first{border-color:var(--accent);box-shadow:4px 4px 0 var(--accent)}
.kc .r1{display:flex;align-items:center;gap:8px}.kc .num{font-family:"Shrikhand";font-size:24px;color:var(--accent)}
.kc ul{list-style:none;padding:10px 0;margin:10px 0;border-block:2px dashed var(--line);display:grid;gap:8px;font-size:19px;font-weight:800}
.kc ul em{display:block;font-style:normal;font-size:14px;color:var(--accent)}.kobs{font-weight:900;background:var(--mustard);color:#233b2b;border-radius:10px;padding:8px 10px;margin-bottom:10px}
.meter{display:block;height:10px;border-radius:99px;background:var(--soft);overflow:hidden}.meter i{display:block;height:100%;border-radius:99px}
.ent{display:flex;gap:6px}.ent .in{width:90px;padding:6px 8px}
.addrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.addrow .in{flex:1;min-width:110px}.addrow select.in{flex:0 0 110px}
.cp{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}.cp>div{flex:1;min-width:0}.cp b{font-weight:900;letter-spacing:.04em}.cp small{display:block;color:var(--muted);font-size:12px;font-weight:700}.cp.off{opacity:.55}
.stamps{display:inline-flex;gap:3px}.stamps i{width:11px;height:11px;border-radius:50%;border:2px solid var(--ink)}.stamps i.on{background:var(--accent);border-color:var(--accent)}
.vc{display:flex;align-items:flex-end;gap:8px;height:200px;padding-top:20px}
.vcol{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0}
.vcol i{width:100%;max-width:46px;background:var(--accent);border-radius:8px 8px 3px 3px;min-height:2px}
.vcol span{font-size:11.5px;font-weight:800;color:var(--muted);margin-top:6px;white-space:nowrap}.vcol small{font-size:10.5px;font-weight:800;margin-bottom:4px;white-space:nowrap}
.rg{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.hb{display:grid;grid-template-columns:120px 1fr 84px;align-items:center;gap:10px;padding:5px 0;font-size:13px;font-weight:800}
.hb span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hb i{display:block;height:14px;border-radius:6px}.hb b{text-align:right;font-variant-numeric:tabular-nums}
.hrs{display:inline-flex;align-items:center;gap:8px;font-weight:800}.hrs .in{width:120px;padding:6px 8px}
.wa2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px;align-items:start}
.bubble{background:#dcf8c6;color:#111;border-radius:12px 12px 12px 3px;padding:10px 12px;font-size:13.5px;line-height:1.4;position:relative}.bubble small{display:block;text-align:right;font-size:11px;color:#667;margin-top:4px}
code{background:var(--soft);border-radius:6px;padding:1px 5px;font-size:12px}
@media (max-width:860px){.rg,.wa2{grid-template-columns:1fr}.hb{grid-template-columns:90px 1fr 70px}.me span:last-child{display:none}}

.empty{color:var(--muted);text-align:center;padding:28px 10px;font-weight:700}
/* mapa */
.mapgrid{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:16px;align-items:start}
.mapcard{border:2px solid var(--ink);border-radius:22px;overflow:hidden;background:var(--map-bg);box-shadow:4px 4px 0 var(--shadow);position:relative}
.mapcard svg [data-h]{vector-effect:none}.mapcard svg{display:block;width:100%;height:auto;touch-action:none;user-select:none}
.maptools{position:absolute;left:10px;top:10px;display:flex;gap:6px;flex-wrap:wrap}
.legend{position:absolute;right:10px;bottom:10px;background:var(--card);border:2px solid var(--ink);border-radius:10px;padding:4px 8px;font-size:11.5px;font-weight:900}
.zl{display:grid;gap:8px}
.zc{border:2px solid var(--ink);border-radius:16px;background:var(--card);padding:10px 12px;text-align:left;width:100%}
.zc.on{box-shadow:3px 3px 0 var(--shadow);border-color:var(--accent)}
.zc .h{display:flex;align-items:center;gap:8px}
.zc .dot{width:14px;height:14px;border-radius:5px;flex:none;border:2px solid var(--ink)}
.zc .h b{flex:1;font-weight:900}
.zc .h small{font-weight:800;color:var(--muted);font-size:12px}
.zc .ed{margin-top:8px;display:grid;gap:8px}
.zc .ed .row3{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.zc label small{display:block;font-weight:900;font-size:11.5px;color:var(--muted);margin-bottom:3px}
.hint{font-size:12.5px;color:var(--muted);line-height:1.45;margin-top:10px}
.chk{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13px}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.preview{margin-top:14px;border:2px dashed var(--ink);border-radius:16px;padding:12px}
.preview h4{font-weight:900;font-size:13px;margin-bottom:8px}
/* despacho */
.disp{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;align-items:start}
.ready{display:flex;gap:10px;align-items:flex-start;padding:10px;border:2px solid var(--ink);border-radius:14px;background:var(--card);margin-bottom:8px;cursor:pointer}
.ready.sel{background:color-mix(in srgb,var(--mustard) 35%,var(--card))}
.ready input{width:18px;height:18px;margin-top:2px;accent-color:var(--accent)}
.ready .t{flex:1;min-width:0}
.ready b{font-weight:900}
.ready small{display:block;color:var(--muted);font-size:12.5px}
.rc{border:2px solid var(--ink);border-radius:16px;background:var(--card);padding:12px;margin-bottom:10px}
.rc .h{display:flex;align-items:center;gap:10px}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:900;color:#fff;border:2px solid var(--ink);flex:none}
.rc .h div{flex:1}
.rc small{display:block;color:var(--muted);font-size:12px;font-weight:700}
.rc .k{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0}
.rc .k span{background:var(--soft);border-radius:10px;padding:6px 8px;font-size:11.5px;font-weight:800;color:var(--muted)}
.rc .k b{display:block;color:var(--fg);font-size:14px}
.stops{font-size:12.5px;margin:4px 0 10px;display:grid;gap:3px}
.sec{font-weight:900;font-size:15px;margin:4px 0 10px}
/* caixa */
.cx{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-size:12px;color:var(--muted);font-weight:900;padding:8px 6px;border-bottom:2px solid var(--ink)}
.tbl td{padding:8px 6px;border-bottom:1px dashed var(--line)}
.tbl td.n,.tbl th.n{text-align:right;font-variant-numeric:tabular-nums}
.diff{font-size:22px;font-weight:900}
/* entregador */
.stage{display:grid;place-items:center;padding:18px 12px 30px}
.cap{max-width:560px;text-align:center;margin-bottom:14px}
.phone{width:390px;max-width:100%;height:min(800px,calc(100dvh - 150px));min-height:600px;border-radius:44px;box-shadow:0 0 0 10px #111,0 40px 80px -30px rgba(0,0,0,.5);overflow:hidden;position:relative;background:var(--bg);display:flex;flex-direction:column}
.ph-top{padding:16px 16px 10px;display:flex;align-items:center;gap:10px;border-bottom:2px solid var(--ink);background:var(--card)}
.ph-top .who{flex:1}
.ph-top .who b{display:block;font-weight:900}
.ph-top .who small{color:var(--muted);font-size:12px;font-weight:700}
.sw{position:relative;width:52px;height:30px;border-radius:99px;border:2px solid var(--ink);background:var(--soft)}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--ink);transition:left .2s}
.sw.on{background:var(--ok)}.sw.on::after{left:25px;background:#fff}
.ph-body{flex:1;overflow-y:auto;padding:14px 14px 20px;scrollbar-width:none}
.ph-body::-webkit-scrollbar{display:none}
.ph-tabs{display:grid;grid-template-columns:repeat(3,1fr);border-top:2px solid var(--ink);background:var(--card)}
.ph-tabs button{border:0;background:none;padding:10px 0 14px;font-weight:900;font-size:12.5px;display:grid;justify-items:center;gap:2px;opacity:.5}
.ph-tabs button.on{opacity:1;color:var(--accent)}
.ph-tabs i{font-style:normal;font-size:18px}
.mini{border:2px solid var(--ink);border-radius:18px;overflow:hidden;background:var(--map-bg)}
.mini svg{display:block;width:100%;height:auto}
.prog{display:flex;justify-content:space-between;font-weight:900;font-size:12.5px;margin:12px 2px 8px;color:var(--muted)}
.next{border:2px solid var(--ink);border-radius:20px;background:var(--card);padding:14px;box-shadow:4px 4px 0 var(--shadow)}
.next .tag{font-size:11px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.next h3{font-family:"Shrikhand";font-weight:400;font-size:22px;line-height:1.1;margin-top:2px}
.next p{color:var(--muted);font-weight:700;margin-top:2px}
.money{margin-top:10px;border-radius:12px;padding:10px 12px;font-weight:900;font-size:13.5px;background:var(--mustard);color:#233b2b;border:2px solid #233b2b}
.money.paid{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--fg);border-color:transparent}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.big{min-height:52px;font-size:15px;border-radius:16px;width:100%}
.code{display:flex;gap:8px;margin-top:10px}
.code input{flex:1;text-align:center;letter-spacing:.5em;font-size:22px;font-weight:900}
.list{margin-top:14px;display:grid;gap:8px}
.li{display:flex;gap:10px;align-items:center;border:2px solid var(--line);border-radius:14px;padding:10px;background:var(--card)}
.li .n{width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--on-ink);display:grid;place-items:center;font-weight:900;font-size:12px;flex:none}
.li .t{flex:1;min-width:0}.li b{font-weight:900;font-size:13.5px}.li small{display:block;color:var(--muted);font-size:12px}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi div{border:2px solid var(--ink);border-radius:16px;padding:12px;background:var(--card)}
.kpi small{display:block;font-size:11.5px;font-weight:900;color:var(--muted)}
.kpi b{font-size:20px;font-weight:900}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:99;background:var(--ink);color:var(--on-ink);padding:10px 16px;border-radius:99px;font-weight:900;font-size:13.5px;animation:pop .2s;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:80;display:grid;place-items:center;padding:16px}
.comanda{background:#fff;color:#111;width:300px;max-width:100%;padding:18px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px;line-height:1.5;border-radius:6px}
.comanda hr{border:0;border-top:1px dashed #111;margin:8px 0}
.comanda .acts{display:flex;gap:8px;margin-top:12px;font-family:"Nunito"}
@media print{body *{visibility:hidden}.comanda,.comanda *{visibility:visible}.comanda{position:absolute;left:0;top:0}.comanda .acts{display:none}}
@media (max-width:1100px){.pdv,.mapgrid,.disp{grid-template-columns:minmax(0,1fr)}.tk{position:static}}
@media (max-width:860px){.wrap{grid-template-columns:minmax(0,1fr)}nav{border-right:0;border-bottom:2px solid var(--ink);display:flex;overflow-x:auto;padding:8px;position:sticky;top:58px;z-index:20;scrollbar-width:none}nav button{flex:none;padding:8px 12px}nav .foot{display:none}main{padding:16px}.stats{grid-template-columns:1fr 1fr}.cx{grid-template-columns:1fr}.top{padding:10px 16px}}
@media (max-width:480px){.phone{border-radius:26px;box-shadow:0 0 0 6px #111;height:calc(100dvh - 130px)}.cap{display:none}h1.t{font-size:25px}.top .pill{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- utilidades de rota ---------- */
const riderOrders=id=>S.orders.filter(o=>o.rider===id&&o.status==="rota").sort((a,b)=>a.seq-b.seq);
function reseq(id){const r=S.riders.find(x=>x.id===id);let cur=r?r.pos:STORE;const rest=S.orders.filter(o=>o.rider===id&&o.status==="rota");let n=1;
  while(rest.length){rest.sort((a,b)=>dist(cur,a.pt)-dist(cur,b.pt));const o=rest.shift();o.seq=n++;cur=o.pt}}
function routeKm(id){const r=S.riders.find(x=>x.id===id);let cur=r.pos,d=0;riderOrders(id).forEach(o=>{d+=dist(cur,o.pt);cur=o.pt});return d}
const cashHeld=id=>S.orders.filter(o=>o.rider===id&&o.status==="entregue"&&o.pay==="dinheiro"&&!o.settled).reduce((s,o)=>s+total(o),0);
const earned=id=>S.orders.filter(o=>o.rider===id&&o.status==="entregue").reduce((s,o)=>s+o.fee,0);
const riderName=id=>(S.riders.find(r=>r.id===id)||{}).name||"—";

function finish(o){const r=S.riders.find(x=>x.id===o.rider);
  if(r){o.km=+(dist(r.pos,o.pt)/100).toFixed(1);r.kmT=+((r.kmT||0)+o.km).toFixed(1);r.pos={...o.pt}}
  o.status="entregue";o.dAt=Date.now();o.arrived=false;if(r)reseq(r.id);notify(o,"entregue")}

  s+=`<path d="M-20 650 C 200 570, 300 770, 520 705 S 860 560, 1220 630" fill="none" stroke="var(--map-water)" stroke-width="30" stroke-linecap="round"/>`;
  for(let x=45;x<1200;x+=90)s+=`<line x1="${x}" y1="0" x2="${x+20}" y2="800" stroke="var(--map-st)" stroke-width="5"/>`;
  for(let y=40;y<800;y+=85)s+=`<line x1="0" y1="${y}" x2="1200" y2="${y-15}" stroke="var(--map-st)" stroke-width="5"/>`;
  s+=`<path d="M0 410 H1200 M600 0 V800 M80 780 L1160 60" stroke="var(--map-av)" stroke-width="13" fill="none"/>`;

  return BASE=s}
function storeMk(){return`<g transform="translate(${STORE.x} ${STORE.y})"><circle r="22" fill="var(--accent)" stroke="var(--ink)" stroke-width="4"/><text y="8" text-anchor="middle" font-family="Shrikhand" font-size="22" fill="#fff">B</text></g>`}
function zonesLayer(edit,faint){
  return[...S.zones].sort((a,b)=>area(b)-area(a)).map(z=>{
    const sel=edit&&S.sel===z.id,op=faint?.07:(sel?.22:.13),sw=sel?5:3,da=z.on?"":`stroke-dasharray="14 10"`;
    let s=z.type==="circle"?`<circle data-z="${z.id}" cx="${z.cx}" cy="${z.cy}" r="${z.r}" fill="${z.color}" fill-opacity="${op}" stroke="${z.color}" stroke-width="${sw}" ${da} style="cursor:${edit?"move":"default"}"/>`
      :`<polygon data-z="${z.id}" points="${z.pts.map(p=>p.join(",")).join(" ")}" fill="${z.color}" fill-opacity="${op}" stroke="${z.color}" stroke-width="${sw}" stroke-linejoin="round" ${da} style="cursor:${edit?"move":"default"}"/>`;
    if(sel){
      if(z.type==="circle"){
        s+=`<line x1="${z.cx}" y1="${z.cy}" x2="${z.cx+z.r}" y2="${z.cy}" stroke="${z.color}" stroke-width="3" stroke-dasharray="6 6"/>`;
        s+=`<g transform="translate(${z.cx+z.r/2} ${z.cy-14})"><rect x="-46" y="-20" width="92" height="28" rx="10" fill="var(--card)" stroke="var(--ink)" stroke-width="2.5"/><text y="0" text-anchor="middle" font-size="16" font-weight="900" fill="var(--fg)">${km(z.r)}</text></g>`;
        s+=`<circle data-h="c" cx="${z.cx}" cy="${z.cy}" r="13" fill="var(--card)" stroke="${z.color}" stroke-width="5" style="cursor:move"/>`;
        s+=`<g data-h="r" transform="translate(${z.cx+z.r} ${z.cy})" style="cursor:ew-resize"><circle r="20" fill="${z.color}" stroke="var(--ink)" stroke-width="3"/><path d="M-10 0 H10 M-10 0 l5 -5 M-10 0 l5 5 M10 0 l-5 -5 M10 0 l-5 5" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/></g>`;
      }else{
        z.pts.forEach((p,i)=>{const q=z.pts[(i+1)%z.pts.length];s+=`<circle data-h="m" data-i="${i}" cx="${(p[0]+q[0])/2}" cy="${(p[1]+q[1])/2}" r="9" fill="var(--card)" stroke="${z.color}" stroke-width="3" style="cursor:copy"/>`});
        z.pts.forEach((p,i)=>s+=`<circle data-h="v" data-i="${i}" cx="${p[0]}" cy="${p[1]}" r="15" fill="${z.color}" stroke="var(--ink)" stroke-width="3" style="cursor:grab"/>`);
      }
    }
    return s}).join("")}
function pinMk(p,label,color,dataH){return`<g ${dataH?`data-h="${dataH}"`:""} transform="translate(${p.x} ${p.y})" style="${dataH?"cursor:grab":""}"><path d="M0 0 C-6 -14 -20 -20 -20 -34 A20 20 0 1 1 20 -34 C20 -20 6 -14 0 0Z" fill="${color}" stroke="var(--ink)" stroke-width="3"/><text y="-27" text-anchor="middle" font-size="16" font-weight="900" fill="#fff">${label}</text></g>`}

  const cp=applyCoupon(d.cupom||"",sub-desc,fee);return{sub,desc:desc+cp.d,cp,z,pt,fee,tot:sub-desc-cp.d+fee}}

function shrink(file){return new Promise((ok,no)=>{const r=new FileReader();r.onerror=no;r.onload=()=>{const im=new Image();im.onerror=no;im.onload=()=>{const m=800,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",.8))};im.src=r.result};r.readAsDataURL(file)})}

/* ----- Horários ----- */
const DOW=["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"];
const toM=x=>+x.slice(0,2)*60+ +x.slice(3,5);
const isoDay=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
function storeStatus(now=new Date()){
  if(S.paused)return{open:false,label:"Pausada"};
  const hol=S.holidays.find(h=>h.d===isoDay(now));if(hol)return{open:false,label:`Fechada · ${hol.n}`};
  const d=S.hours[now.getDay()],m=now.getHours()*60+now.getMinutes();
  if(d.on&&m>=toM(d.a)&&m<toM(d.b))return{open:true,label:`Aberta até ${d.b}`};
  for(let i=0;i<8;i++){const k=(now.getDay()+i)%7,dd=S.hours[k];if(dd.on&&(i>0||m<toM(dd.a)))return{open:false,label:`Fechada · abre ${i===0?"hoje":i===1?"amanhã":DOW[k].toLowerCase()} ${dd.a}`}}
  return{open:false,label:"Fechada"}}

function applyCoupon(code,sub,fee){code=String(code).trim().toUpperCase();if(!code)return{d:0};
  const c=S.coupons.find(x=>x.code===code);if(!c||!c.on)return{d:0,err:"Cupom inválido ou desativado"};
  if(sub<c.min)return{d:0,err:`Esse cupom vale a partir de ${brl(c.min)}`};
  return{c,d:c.type==="pct"?Math.round(sub*c.v/100):c.type==="brl"?Math.min(c.v,sub):fee}}

  p.rec.forEach(([sid,q])=>{const x=stk(sid);if(x)x.q=Math.max(0,+(x.q-q*i.qty).toFixed(3))})});autoStock()}

/* ----- Clientes e cupons ----- */
function allRecs(){return[...S.hist,...S.orders.filter(o=>o.status!=="cancelado").map(o=>({t:o.dAt||o.t,cliente:o.cliente,fone:o.fone,src:o.src,type:o.type,bairro:o.type==="delivery"?o.bairro:null,
  items:o.items.map(i=>({name:i.name,qty:i.qty,price:i.price})),total:total(o),fee:o.fee,pay:o.pay,rider:o.rider,km:o.km||0,status:o.status}))]}
function customers(){const m=new Map();allRecs().forEach(r=>{if(!r.fone||r.fone==="—"||r.cliente==="Balcão"||/^Mesa/.test(r.cliente))return;
  const c=m.get(r.fone)||{nome:r.cliente,fone:r.fone,n:0,v:0,last:0,bairro:r.bairro};c.n++;c.v+=r.total;if(r.t>c.last){c.last=r.t;c.bairro=r.bairro||c.bairro}m.set(r.fone,c)});
  return[...m.values()].sort((a,b)=>b.n-a.n)}
function stamps(n){const L=S.loyal,k=n%L.n,show=Math.min(L.n,10);return`<span class="stamps" title="${k} de ${L.n}">${Array.from({length:show},(_,i)=>`<i class="${i<Math.round(k*show/L.n)?"on":""}"></i>`).join("")}</span>${k===0&&n?` 🎁`:""}`}

   ${C.map(c=>`<tr><td><b>${esc(c.nome)}</b><br><small style="color:var(--muted)">${esc(c.fone)}${c.bairro?" · "+esc(c.bairro):""}</small></td><td class="n">${c.n}</td><td class="n">${brl(c.v)}</td><td>${new Date(c.last).toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"})}</td>
    ${L.on?`<td>${stamps(c.n)}</td>`:""}<td><a class="btn sm ghost" href="https://wa.me/55${c.fone.replace(/\D/g,"")}?text=${encodeURIComponent(`Oi ${c.nome.split(" ")[0]}! Saudade de você aqui na Bella 🍝 Use o cupom BEMVINDO e ganhe 10% hoje.`)}" target="_blank" rel="noopener" aria-label="WhatsApp">💬</a></td></tr>`).join("")}</tbody></table></div>

/* ----- Relatórios ----- */
function bars(list,fmt,color="var(--accent)"){const mx=Math.max(1,...list.map(x=>x[1]));return list.map(([l,v])=>`<div class="hb"><span>${esc(l)}</span><i style="width:${Math.max(2,v/mx*100)}%;background:${color}"></i><b>${fmt(v)}</b></div>`).join("")||`<p class="empty">Sem dados</p>`}
function group(R,key,val){const m=new Map();R.forEach(r=>{const k=key(r);if(k==null)return;m.set(k,(m.get(k)||0)+val(r))});return[...m.entries()].sort((a,b)=>b[1]-a[1])}
function vRel(){const today=new Date();today.setHours(0,0,0,0);const t0=S.rep==="hoje"?today.getTime():today.getTime()-6*864e5;
  const R=allRecs().filter(r=>r.status==="entregue"&&r.t>=t0),fat=R.reduce((a,r)=>a+r.total,0),fees=R.reduce((a,r)=>a+r.fee,0);
  let cols;if(S.rep==="hoje"){cols=[];for(let h=11;h<=23;h++)cols.push([h+"h",R.filter(r=>new Date(r.t).getHours()===h).reduce((a,r)=>a+r.total,0)])}
  else{cols=[];for(let i=6;i>=0;i--){const d=new Date(today.getTime()-i*864e5),e=d.getTime()+864e5;cols.push([DOW[d.getDay()].slice(0,3)+" "+d.getDate(),R.filter(r=>r.t>=d.getTime()&&r.t<e).reduce((a,r)=>a+r.total,0)])}}
  const mx=Math.max(1,...cols.map(c=>c[1])),peak=cols.reduce((a,c)=>c[1]>a[1]?c:a,cols[0]);
  const hours=group(R,r=>new Date(r.t).getHours(),()=>1)[0];
  const prods=group(R.flatMap(r=>r.items),i=>i.name,i=>i.qty).slice(0,6);
  const riders=S.riders.map(rd=>{const L=R.filter(r=>r.rider===rd.id);return{rd,n:L.length,fee:L.reduce((a,r)=>a+r.fee,0),km:L.reduce((a,r)=>a+(r.km||0),0)}});
  return`<div class="hd"><div><h1 class="t">Relatórios</h1><p class="sub">Vendas entregues no período. Os dados de dias anteriores são de exemplo.</p></div><span class="sp"></span><div class="seg">${[["hoje","Hoje"],["7d","7 dias"]].map(([k,t])=>`<button data-rep="${k}" class="${S.rep===k?"on":""}">${t}</button>`).join("")}</div></div>
  <div class="stats"><div class="stat"><small>Faturamento</small><b>${brl(fat)}</b></div><div class="stat"><small>Pedidos</small><b>${R.length}</b></div><div class="stat"><small>Ticket médio</small><b>${brl(R.length?fat/R.length:0)}</b></div><div class="stat"><small>Horário de pico</small><b>${hours?hours[0]+"h":"—"}</b></div></div>
  <div class="card"><p class="sec">${S.rep==="hoje"?"Vendas por hora":"Vendas por dia"}${peak&&peak[1]?` <small style="color:var(--muted);font-weight:800">· melhor: ${peak[0]} (${brl(peak[1])})</small>`:""}</p>
   <div class="vc">${cols.map(([l,v])=>`<div class="vcol" title="${l}: ${brl(v)}"><small>${v?brl(v).replace(",00",""):""}</small><i style="height:${v/mx*100}%"></i><span>${l}</span></div>`).join("")}</div></div>
  <div class="rg"><div class="card"><p class="sec">Pratos mais vendidos</p>${bars(prods,v=>v+" un")}</div>
   <div class="card"><p class="sec">Vendas por bairro</p>${bars(group(R,r=>r.bairro,r=>r.total).slice(0,6),brl,"#2f7d4f")}</div>
   <div class="card"><p class="sec">Por canal</p>${bars(group(R,r=>r.src,r=>r.total),brl,"#d99a1e")}</div>
   <div class="card"><p class="sec">Por forma de pagamento</p>${bars(group(R,r=>PAY[r.pay],r=>r.total),brl,"#3c6fb6")}</div></div>
  <div class="card" style="margin-top:14px;overflow-x:auto"><p class="sec">Entregadores</p><table class="tbl"><thead><tr><th>Entregador</th><th class="n">Entregas</th><th class="n">Km</th><th class="n">Taxas (a pagar)</th></tr></thead><tbody>
   ${riders.map(x=>`<tr><td><b>${esc(x.rd.name)}</b></td><td class="n">${x.n}</td><td class="n">${km(x.km*100)}</td><td class="n">${brl(x.fee)}</td></tr>`).join("")}<tr><td><b>Total</b></td><td class="n"><b>${riders.reduce((a,x)=>a+x.n,0)}</b></td><td></td><td class="n"><b>${brl(fees)}</b></td></tr></tbody></table></div>`}

/* ----- Caixa ----- */
function cxData(){const c=S.caixa,sales=S.orders.filter(o=>o.status==="entregue"&&o.dAt>=c.at);
  const by={pix:0,cartao:0,dinheiro:0};sales.forEach(o=>by[o.pay]+=total(o));
  const withR=S.riders.reduce((s,r)=>s+cashHeld(r.id),0);
  const sang=c.movs.filter(m=>m.tipo==="Sangria").reduce((s,m)=>s+m.v,0),sup=c.movs.filter(m=>m.tipo==="Suprimento").reduce((s,m)=>s+m.v,0);
  return{sales,by,withR,sang,sup,exp:c.fundo+by.dinheiro-withR+sup-sang}}
function vCaixa(){const c=S.caixa;
  if(!c.open)return`<div class="hd"><div><h1 class="t">Caixa</h1><p class="sub">Caixa fechado${c.last?` às ${hhmm(c.last.t)} · diferença ${brl(c.last.diff)}`:""}. Abra para começar o turno.</p></div></div>
   <div class="card" style="max-width:380px"><span class="lbl" style="margin-top:0">Fundo de troco</span><input class="in" id="fundo" value="100,00" inputmode="decimal"><button class="btn red big" style="margin-top:12px" data-act="cxopen">Abrir caixa</button></div>`;
  const d=cxData(),f=S.cx;
  const rows=[...d.sales.map(o=>({t:o.dAt,d:`Venda #${o.num} · ${o.src}${o.rider&&o.pay==="dinheiro"&&!o.settled?" · com "+riderName(o.rider):""}`,p:PAY[o.pay],v:total(o)})),...c.movs.map(m=>({t:m.t,d:`${m.tipo}${m.d?" · "+m.d:""}`,p:"Dinheiro",v:m.tipo==="Sangria"?-m.v:m.v}))].sort((a,b)=>b.t-a.t);
  return`<div class="hd"><div><h1 class="t">Caixa</h1><p class="sub">Aberto às ${hhmm(c.at)} com fundo de ${brl(c.fundo)}. As vendas entram quando o pedido é entregue. O dinheiro que está com o motoboy só conta na gaveta depois do acerto.</p></div><span class="sp"></span>
   <button class="btn" data-act="cxform" data-id="Sangria">− Sangria</button><button class="btn" data-act="cxform" data-id="Suprimento">+ Suprimento</button><button class="btn dark" data-act="cxform" data-id="fechar">Fechar caixa</button></div>
  ${f?`<div class="card" style="margin-bottom:14px;max-width:520px">${f==="fechar"?`<b>Conferência de fechamento</b><p class="sub">Conte o dinheiro da gaveta. O sistema espera <b>${brl(d.exp)}</b>.${d.withR?` Ainda há ${brl(d.withR)} com entregadores sem acerto.`:""}</p>
    <div class="row2" style="margin-top:8px"><div><span class="lbl">Contado na gaveta</span><input class="in" data-cxcount value="${esc(S.cxCount)}" placeholder="R$ 0,00" inputmode="decimal"></div><div><span class="lbl">Diferença</span><div class="diff" id="cxdiff">${S.cxCount?brl(parseBRL(S.cxCount)-d.exp):"—"}</div></div></div>
    <div style="display:flex;gap:8px;margin-top:12px"><button class="btn ghost" data-act="cxcancel">Voltar</button><button class="btn red" data-act="cxclose">Confirmar fechamento</button></div>`
   :`<b>${f}</b><div class="row2" style="margin-top:6px"><div><span class="lbl">Valor</span><input class="in" id="cxv" placeholder="R$ 0,00" inputmode="decimal"></div><div><span class="lbl">Motivo</span><input class="in" id="cxd" placeholder="${f==="Sangria"?"Ex.: troco do gás":"Ex.: reforço de troco"}"></div></div>
    <div style="display:flex;gap:8px;margin-top:12px"><button class="btn ghost" data-act="cxcancel">Cancelar</button><button class="btn red" data-act="cxmov">Registrar</button></div>`}</div>`:""}
  <div class="cx"><div class="stat"><small>Pix</small><b>${brl(d.by.pix)}</b></div><div class="stat"><small>Cartão</small><b>${brl(d.by.cartao)}</b></div><div class="stat"><small>Dinheiro (vendas)</small><b>${brl(d.by.dinheiro)}</b></div>

/* ----- App do entregador (TMS) ----- */
function vCourier(){const r=S.riders.find(x=>x.id===S.courier),L=riderOrders(r.id),avail=S.orders.filter(o=>o.status==="pronto"&&o.type==="delivery");
  let body="";
  if(S.cTab==="rota"){
    if(!r.online)body=`<p class="empty">Você está offline.<br>Ligue a chave lá em cima para receber corridas.</p>`;
    else if(!L.length)body=`<p class="empty">Sem entregas agora 🍝<br>${avail.length?`Tem ${avail.length} pedido${avail.length>1?"s":""} pronto${avail.length>1?"s":""} esperando. Veja em <b>Disponíveis</b>.`:"Fica de olho: a loja te chama aqui."}</p>`;
    else{const o=L[0],pts=[r.pos,...L.map(x=>x.pt)],xs=pts.map(p=>p.x),ys=pts.map(p=>p.y);
      let x0=Math.min(...xs)-90,x1=Math.max(...xs)+90,y0=Math.min(...ys)-110,y1=Math.max(...ys)+70;const w=Math.max(x1-x0,(y1-y0)*1.4),hh=w/1.4,cx=(x0+x1)/2,cy=(y0+y1)/2;
      const ex=routeLine(r.pos,L,r.color)+L.map(x=>pinMk(x.pt,x.seq,x===o?"#d8432f":r.color)).join("")+riderMk(r);
      const tr=o.pay==="dinheiro"&&o.troco>total(o)?o.troco-total(o):0;
      body=`<div class="mini">${mapSVG({faint:true,vb:`${cx-w/2} ${cy-hh/2} ${w} ${hh}`,extra:ex})}</div>
      <div class="prog"><span>Parada 1 de ${L.length}</span><span>≈ ${km(routeKm(r.id))} · ${Math.round(routeKm(r.id)/100*3+L.length*3)} min</span></div>

let drag=null,lastTap=0;
function svgPt(e){const s=document.getElementById("map"),p=s.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const q=p.matrixTransform(s.getScreenCTM().inverse());return{x:Math.max(0,Math.min(1200,q.x)),y:Math.max(0,Math.min(800,q.y))}}
function redraw(){const zl=document.getElementById("zl");if(zl)zl.innerHTML=zonesLayer(true,false);const pl=document.getElementById("pinl");if(pl)pl.innerHTML=pinMk(S.pin,"📍","#233b2b","pin");
  const pr=document.getElementById("pinres");if(pr)pr.innerHTML=pinResult();
  const z=S.zones.find(x=>x.id===S.sel),hdr=document.querySelector(".zc.on .h small");if(z&&hdr)hdr.textContent=`${z.type==="circle"?"Raio "+km(z.r):"Área livre"} · ${brl(z.fee)}`;
  const ri=document.querySelector('[data-zf="r"]');if(z&&ri&&document.activeElement!==ri)ri.value=(z.r/100).toFixed(1).replace(".",",")}
document.addEventListener("pointerdown",e=>{const svg=e.target.closest("svg[data-edit]");if(!svg)return;
  const h=e.target.closest("[data-h]"),zEl=e.target.closest("[data-z]"),p=svgPt(e);
  if(h){const k=h.dataset.h,z=S.zones.find(x=>x.id===S.sel);
    if(k==="pin")drag={k};
    else if(k==="v"){const i=+h.dataset.i,now=Date.now();if(now-lastTap<350&&z.pts.length>3){z.pts.splice(i,1);lastTap=0;save();redraw();return}lastTap=now;drag={k,i}}
    else if(k==="m"){const i=+h.dataset.i;z.pts.splice(i+1,0,[Math.round(p.x),Math.round(p.y)]);drag={k:"v",i:i+1}}
    else drag={k};
  }else if(zEl){if(S.sel!==zEl.dataset.z){S.sel=zEl.dataset.z;commit();return}const z=S.zones.find(x=>x.id===S.sel);drag={k:"move",p0:p,o:z.type==="circle"?{cx:z.cx,cy:z.cy}:z.pts.map(q=>[...q])}}
  else return;
  e.preventDefault();redraw()});
addEventListener("pointermove",e=>{if(!drag)return;const p=svgPt(e),z=S.zones.find(x=>x.id===S.sel);
  if(drag.k==="pin")S.pin=p;
  else if(drag.k==="c"){z.cx=Math.round(p.x);z.cy=Math.round(p.y)}
  else if(drag.k==="r")z.r=Math.round(Math.max(40,Math.min(1200,dist(p,{x:z.cx,y:z.cy}))));
  else if(drag.k==="v")z.pts[drag.i]=[Math.round(p.x),Math.round(p.y)];
  else if(drag.k==="move"){const dx=p.x-drag.p0.x,dy=p.y-drag.p0.y;if(z.type==="circle"){z.cx=Math.round(drag.o.cx+dx);z.cy=Math.round(drag.o.cy+dy)}else z.pts=drag.o.map(([x,y])=>[Math.round(x+dx),Math.round(y+dy)])}
  redraw()});
addEventListener("pointerup",()=>{if(drag){drag=null;save()}});
if(!load()||!S.users)fresh();
render();
</script></body></html>
